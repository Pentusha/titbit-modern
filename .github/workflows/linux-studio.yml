name: Linux Studio and importer

on:
  push:
    paths: ['linux-port/**', '.github/workflows/linux-studio.yml']
  pull_request:
    paths: ['linux-port/**', '.github/workflows/linux-studio.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Studio dependency
        run: python -m pip install -r linux-port/requirements-studio.txt
      - name: Studio tests (synthetic fixtures; no game assets)
        working-directory: linux-port
        run: python -m unittest discover -s editor -p 'test_*.py' -v
      - name: Importer tests (synthetic fixtures; no disc downloads)
        working-directory: linux-port
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Check launch scripts
        run: |
          sh -n linux-port/start-game.sh
          sh -n linux-port/tools/import_assets.sh
          sh -n linux-port/tools/start_studio.sh
